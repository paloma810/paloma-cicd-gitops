steps:
  # Step 1: Display current Git branch
  - id: 'display-branch'
    name: 'alpine'
    entrypoint: 'sh'
    args:
      - '-c'
      - |
        echo "===== Git Branch ====="
        echo "${BRANCH_NAME}"
        echo "======================"

  # Step 2: Initialize Terraform and plan changes
  - id: 'tf-init-and-plan'
    name: 'hashicorp/terraform:latest'
    entrypoint: 'sh'
    secretEnv: ['TF_VAR_aws_access_key', 'TF_VAR_aws_secret_key']
    args:
      - '-c'
      - |
        set -e  # Exit on error

        # Display environment information
        echo "===== Workspace Information ====="
        echo "Current directory: $(pwd)"
        echo "Directory structure:"
        ls -R
        echo ""

        # Fetch full Git history (CloudBuild uses shallow clone by default)
        echo "===== Git History ====="
        git fetch --unshallow > /dev/null 2>&1 || true
        echo "Changed files:"
        git diff --name-only HEAD^ HEAD
        echo ""

        # Determine target environment based on branch
        echo "===== Environment Detection ====="
        # BRANCH_NAME は Cloud Build の変数なので $ のまま
        case "${BRANCH_NAME}" in
          develop)
            ENV="dev"
            ;;
          release)
            ENV="stg"
            ;;
          main)
            ENV="prod"
            ;;
          *)
            echo "Warning: Unknown branch '${BRANCH_NAME}'. Defaulting to dev."
            ENV="dev"
            ;;
        esac
        
        # シェル変数は $$ でエスケープして参照する
        echo "Detected environment: $${ENV}"
        echo ""

        # Extract target directories from changed files
        echo "===== Target Detection ====="
        TARGETS_DIR=$(git diff --name-only HEAD^ HEAD | \
          grep -E "^(environments|components).*\.tf.*" || true | \
          sed -E "s|environments/(dev|prod|stg)|components|g" | \
          xargs -I@ dirname @ 2>/dev/null | \
          uniq | \
          grep -E ".*/.*/.*" || true)

        if [ -z "$${TARGETS_DIR}" ]; then
          echo "No Terraform files changed. Skipping plan."
          exit 0
        fi

        echo "Targets to process:"
        echo "$${TARGETS_DIR}"
        echo ""

        # Process each target directory
        echo "$${TARGETS_DIR}" | while IFS= read -r dir; do
          [ -z "$${dir}" ] && continue

          echo "===== Processing: $${dir} ====="
          cd "$${dir}"

          # Calculate variable file paths
          COMPONENTS_VAR_DIR=$(echo "$${dir}" | sed -E "s|components|environments/$${ENV}|g")
          CLOUD_VAR_DIR=$(dirname "$${COMPONENTS_VAR_DIR}")
          ENV_VAR_DIR=$(dirname "$${CLOUD_VAR_DIR}")
          DEFAULT_VAR_DIR=$(dirname "$${ENV_VAR_DIR}")
          COMPONENTS=$(basename "$${COMPONENTS_VAR_DIR}")
          CLOUD=$(basename "$(dirname "$${COMPONENTS_VAR_DIR}")")

          echo "Configuration paths:"
          echo "  Default: $${DEFAULT_VAR_DIR}/terraform.tfvars"
          echo "  Environment: $${ENV_VAR_DIR}/terraform.tfvars"
          echo "  Cloud: $${CLOUD_VAR_DIR}/terraform.tfvars"
          echo "  Component: $${COMPONENTS_VAR_DIR}/terraform.tfvars"
          echo ""

          # Initialize Terraform
          echo "===== Terraform Init: $${ENV}/$${CLOUD}/$${COMPONENTS} ====="
          terraform init \
            --backend-config="prefix=$${ENV}/$${CLOUD}/$${COMPONENTS}" \
            -migrate-state
          echo ""

          # Plan Terraform changes
          echo "===== Terraform Plan: $${ENV}/$${CLOUD}/$${COMPONENTS} ====="
          terraform plan \
            -var-file="../../../$${DEFAULT_VAR_DIR}/terraform.tfvars" \
            -var-file="../../../$${ENV_VAR_DIR}/terraform.tfvars" \
            -var-file="../../../$${CLOUD_VAR_DIR}/terraform.tfvars" \
            -var-file="../../../$${COMPONENTS_VAR_DIR}/terraform.tfvars"
          echo ""

          cd ../../../
        done

        echo "===== Terraform Plan Complete ====="

availableSecrets:
  secretManager:
    - versionName: projects/181997179469/secrets/paloma-cicd-secret-aws-access-key/versions/latest
      env: 'TF_VAR_aws_access_key'
    - versionName: projects/181997179469/secrets/paloma-cicd-secret-aws-secret-key/versions/latest
      env: 'TF_VAR_aws_secret_key'