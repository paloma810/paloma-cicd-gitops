steps:
- id: 'branch name'
  name: 'alpine'
  entrypoint: 'sh'  
  args: 
  - '-c'
  - | 
      echo "***********************"
      echo "$BRANCH_NAME"
      echo "***********************"

# [START tf-init-and-plan]
- id: 'tf init and plan'
  name: 'hashicorp/terraform:latest'
  entrypoint: 'sh'
  args: 
  - '-c'
  - |
      echo "********** DIRECTORY **********"
      pwd
      echo "********** CONTENTS ***********"
      ls -R
      echo "********** GIT LOG ***********"
      git fetch --unshallow
      git log --oneline --graph --decorate
      echo "********** GIT DIFF ***********"
      git diff --name-only HEAD^ HEAD
      echo "*******************************"
      _TARGETS_DIR=$(git diff --name-only HEAD^ HEAD | grep -E "^(environments|components).*\.tf.*" | sed -E "s/environments\/(dev|prod|stg)/components/g" | xargs -I@ dirname @ | uniq)
      _ENV=""
      case "$BRANCH_NAME" in
        develop) _ENV="dev" ;;
        release) _ENV="stg" ;;
        main)    _ENV="prod" ;;
      esac

      for dir in ${_TARGETS_DIR}
      do
        if [-d $dir]; then
          cd ${dir}
          _COMPONENTS_VAR_DIR=$(echo $dir | sed -E "s/components/environments\/$_ENV/g")
          _CLOUD_VAR_DIR=$(dirname $_COMPONENTS_VAR_DIR)
          _ENV_VAR_DIR=$(dirname $_CLOUD_VAR_DIR)
          _DEFAULT_VAR_DIR=$(dirname $_ENV_VAR_DIR)
          _COMPONENTS=$(basename $_COMPONENTS_VAR_DIR)

          echo "*************** TERRAFORM INIT ****************************"
          echo "******* At environment: $_ENV, Target: $dir ********"
          echo "***********************************************************"
          terraforn init \
            --backend-config=prefix=${_ENV}/${_COMPONENTS} -migrate-state
          terraform plan \
            -var-file="${_DEFAULT_VAR_DIR}/terraform.tfvars" \
            -var-file="${_ENV_VAR_DIR}/terraform.tfvars" \
            -var-file="${_CLOUD_VAR_DIR}/terraform.tfvars" \
            -var-file="${_COMPONENTS_VAR_DIR}/terraform.tfvars"
          cd ../../../
        fi
      done
  secretEnv: ['TF_VAR_aws_access_key', 'TF_VAR_aws_secret_key']
      
availableSecrets:
  secretManager:
  - versionName: projects/181997179469/secrets/paloma-cicd-secret-aws-access-key/versions/latest
    env: 'TF_VAR_aws_access_key'
  - versionName: projects/181997179469/secrets/paloma-cicd-secret-aws-secret-key/versions/latest
    env: 'TF_VAR_aws_secret_key'